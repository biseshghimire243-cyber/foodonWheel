<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FoodShala | My Profile</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .profile-page {
            max-width: 1050px;
            margin: auto;
            padding: 60px 25px 100px;
        }

        .profile-header {
            margin-bottom: 35px;
        }

        .profile-header h1 {
            font-size: 42px;
            color: var(--dark);
            margin-top: 8px;
        }

        .profile-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
        }

        .profile-sidebar,
        .profile-content {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 15px;
        }

        .profile-sidebar {
            padding: 30px 20px;
            text-align: center;
            height: fit-content;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            margin: auto auto 15px;
            border-radius: 50%;
            background: #fff0e9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .profile-sidebar h2 {
            color: var(--dark);
            font-size: 21px;
        }

        .profile-sidebar p {
            color: var(--muted);
            font-size: 14px;
            word-break: break-word;
        }

        .role-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 13px;
            border-radius: 20px;
            background: #fff0e9;
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .profile-content {
            padding: 30px;
        }

        .profile-content h2 {
            color: var(--dark);
            margin-bottom: 25px;
        }

        .profile-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #555;
        }

        .form-group input,
        .form-group textarea {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .readonly {
            background: #f7f7f7;
        }

        .profile-actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .save-btn {
            border: none;
            background: var(--primary);
            color: #fff;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .save-btn:hover {
            background: var(--primary-dark);
        }

        .logout-profile-btn {
            border: 1px solid #ddd;
            background: #fff;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .logout-profile-btn:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        .profile-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .profile-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .profile-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 750px) {

            .profile-layout {
                grid-template-columns: 1fr;
            }

            .profile-form {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>

<header class="navbar">

    <div class="nav-container">

        <a href="/" class="logo">
            🍔 Food<span>Shala</span>
        </a>

        <nav class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/menu">
                Menu
            </a>

            <a href="/orders">
                Orders
            </a>

            <a href="/profile" class="active">
                Profile
            </a>

        </nav>


        <div class="nav-actions">

            <a href="/cart" class="cart-btn">
                🛒
                <span id="cartCount">0</span>
            </a>

            <button
                id="logoutTop"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main class="profile-page">

    <div class="profile-header">

        <span class="section-label">
            ACCOUNT
        </span>

        <h1>
            My Profile
        </h1>

    </div>


    <div class="profile-layout">


        <!-- SIDEBAR -->

        <aside class="profile-sidebar">

            <div class="profile-avatar">
                👤
            </div>

            <h2 id="sidebarName">
                Loading...
            </h2>

            <p id="sidebarEmail">
                Loading...
            </p>

            <span
                class="role-badge"
                id="sidebarRole"
            >
                Customer
            </span>

        </aside>


        <!-- CONTENT -->

        <section class="profile-content">

            <h2>
                Personal Information
            </h2>


            <form
                class="profile-form"
                id="profileForm"
            >

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="readonly"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label>
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="+977 98XXXXXXXX"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Account Role
                    </label>

                    <input
                        type="text"
                        id="role"
                        class="readonly"
                        readonly
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your delivery address"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Member Since
                    </label>

                    <input
                        type="text"
                        id="createdAt"
                        class="readonly"
                        readonly
                    >

                </div>

            </form>


            <div class="profile-actions">

                <button
                    class="save-btn"
                    id="saveBtn"
                >
                    Save Changes
                </button>

                <button
                    class="logout-profile-btn"
                    id="logoutBtn"
                >
                    Logout
                </button>

            </div>


            <div
                id="profileMessage"
                class="profile-message"
            ></div>

        </section>

    </div>

</main>


<footer>

    <div class="copyright">
        © 2026 FoodShala. All Rights Reserved.
    </div>

</footer>


<script src="js/profile.js"></script>

</body>

</html>
