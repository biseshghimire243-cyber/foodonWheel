<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Details | FoodShala</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================
           FOOD DETAILS
        ========================= */

        .food-details-section {
            min-height: calc(100vh - 80px);
            padding: 60px 20px;
            background: #f8f8f8;
        }

        .food-details-container {
            max-width: 1100px;
            margin: auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            color: var(--dark);
            font-weight: 600;
            text-decoration: none;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        .food-details-card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        /* =========================
           IMAGE
        ========================= */

        .food-image-container {
            min-height: 500px;
            background: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .food-image-container img {
            width: 100%;
            height: 100%;
            min-height: 500px;
            object-fit: cover;
        }

        .food-placeholder {
            font-size: 100px;
        }

        /* =========================
           CONTENT
        ========================= */

        .food-info {
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .food-category {
            display: inline-block;
            width: fit-content;
            padding: 7px 14px;
            background: rgba(255, 90, 31, 0.1);
            color: var(--primary);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .food-name {
            font-size: 40px;
            line-height: 1.15;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .food-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .stars {
            color: #f5a623;
            font-size: 20px;
        }

        .rating-text {
            color: var(--muted);
            font-size: 14px;
        }

        .food-price {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 25px;
        }

        .food-description {
            color: var(--text);
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 30px;
        }

        /* =========================
           QUANTITY
        ========================= */

        .quantity-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .quantity-label {
            font-weight: 700;
            color: var(--dark);
        }

        .quantity-control {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .quantity-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #f5f5f5;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .quantity-btn:hover {
            background: var(--primary);
            color: white;
        }

        #quantity {
            width: 45px;
            height: 40px;
            border: none;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            outline: none;
        }

        /* =========================
           BUTTONS
        ========================= */

        .food-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .add-cart-btn,
        .buy-now-btn {
            flex: 1;
            min-width: 160px;
            padding: 15px 20px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }

        .add-cart-btn {
            background: var(--primary);
            color: white;
        }

        .add-cart-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .buy-now-btn {
            background: var(--dark);
            color: white;
        }

        .buy-now-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .message {
            display: none;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #e8f8ee;
            color: #187a3d;
        }

        .message.error {
            display: block;
            background: #fdeaea;
            color: #c62828;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--muted);
        }

        .error-state {
            text-align: center;
            padding: 100px 20px;
        }

        .error-state h2 {
            margin-bottom: 10px;
            color: var(--dark);
        }

        .error-state p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {
            .food-details-card {
                grid-template-columns: 1fr;
            }

            .food-image-container {
                min-height: 350px;
            }

            .food-image-container img {
                min-height: 350px;
            }

            .food-info {
                padding: 30px 25px;
            }

            .food-name {
                font-size: 32px;
            }
        }

        @media (max-width: 500px) {
            .food-details-section {
                padding: 35px 15px;
            }

            .food-info {
                padding: 25px 20px;
            }

            .food-name {
                font-size: 28px;
            }

            .food-price {
                font-size: 27px;
            }

            .food-actions {
                flex-direction: column;
            }

            .add-cart-btn,
            .buy-now-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">
        <div class="container nav-container">

            <a href="/" class="logo">
                🍔 FoodShala
            </a>

            <nav class="nav-links">
                <a href="/">Home</a>
                <a href="/menu">Menu</a>
                <a href="/cart">Cart</a>
                <a href="/orders">Orders</a>
                <a href="/login" id="loginBtn">Login</a>
                <a href="/profile" id="profileBtn" style="display:none;">
                    Profile
                </a>
                <button id="logoutBtn" style="display:none;">
                    Logout
                </button>
            </nav>

        </div>
    </header>


    <!-- =========================
         FOOD DETAILS
    ========================= -->

    <main class="food-details-section">

        <div class="food-details-container">

            <a href="/menu" class="back-btn">
                ← Back to Menu
            </a>

            <div id="foodDetails">

                <div class="food-details-card">

                    <div class="loading">
                        Loading food...
                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="js/food-details.js"></script>

</body>
</html>
