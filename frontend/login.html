```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - FoodShala</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        .auth-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background: #f8f8f8;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff5a1f;
        }

        .login-submit {
            width: 100%;
            border: none;
            padding: 14px;
            background: #ff5a1f;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-submit:hover {
            background: #e54810;
        }

        .login-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .auth-message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .auth-message.error {
            display: block;
            background: #ffe5e5;
            color: #c62828;
        }

        .auth-message.success {
            display: block;
            background: #e5f8e9;
            color: #218838;
        }

        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
        }

        .auth-footer a {
            color: #ff5a1f;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="/" class="logo">
                🍔 FoodShala
            </a>

            <div class="nav-links">

                <a href="/">Home</a>

                <a href="/menu">
                    Menu
                </a>

                <a href="/login" class="active">
                    Login
                </a>

                <a href="/register">
                    Register
                </a>

            </div>

        </div>

    </nav>


    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to continue to FoodShala
            </p>


            <div
                id="authMessage"
                class="auth-message">
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-submit"
                    id="loginBtn">

                    Login

                </button>

            </form>


            <div class="auth-footer">

                Don't have an account?

                <a href="/register">
                    Register here
                </a>

            </div>

        </div>

    </main>


    <footer class="footer">

        <div class="footer-container">

            <p>
                © 2026 FoodShala. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="/js/auth.js"></script>

</body>

</html>
```
